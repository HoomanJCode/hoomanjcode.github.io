  <script>
    // Apply the theme before any CSS paints so the page never flashes the
    // wrong one. 'theme' in localStorage is 'light', 'dark', or 'system'.
    (function () {
      var choice = null;
      try { choice = localStorage.getItem('theme'); } catch (error) {}
      var dark = choice !== 'light' && choice !== 'dark' ? window.matchMedia('(prefers-color-scheme: dark)').matches : choice === 'dark';
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
  <script>
    // Apply the language and text direction before any CSS paints so the
    // page never flashes the wrong language. 'lang' in localStorage is
    // 'en' or 'fa' (defaults to 'en').
    (function () {
      var lang = null;
      try { lang = localStorage.getItem('lang'); } catch (error) {}
      lang = lang === 'fa' ? 'fa' : 'en';
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
    })();
  </script>

<body data-project="impasse" id="top">
  <div class="grain" aria-hidden="true"></div>
  <div id="projectPage"></div>
  <script>
    // The planet orbit is decorative. A transient CDN failure (504) should
    // never leave the project page broken, so scripts are fetched with
    // retries and backoff. If all attempts fail the page keeps its CSS
    // background. The loader itself is inline so it can never fail to load.
    (function () {
      var SCRIPTS = [
        '../../js/project-data.js',
        '../../js/translations.js',
        '../../js/theme.js',
        '../../js/lang.js',
        '../../js/project-page.js',
        '../../js/components/detail-orbit.js'
      ];
      var MAX_ATTEMPTS = 3;
      var BASE_DELAY = 600;

      var load = function (src, attempt) {
        var script = document.createElement('script');
        script.src = attempt > 1 ? src + '?retry=' + attempt : src;
        script.async = true;
        script.onload = function () { script.onerror = null; };
        script.onerror = function () {
          script.onerror = null;
          script.remove();
          if (attempt < MAX_ATTEMPTS) {
            var delay = BASE_DELAY * Math.pow(2, attempt - 1) + Math.random() * 300;
            setTimeout(function () { load(src, attempt + 1); }, delay);
          }
        };
        document.body.appendChild(script);
      };

      SCRIPTS.forEach(function (src) { load(src, 1); });
    })();
  </script>
</body>
