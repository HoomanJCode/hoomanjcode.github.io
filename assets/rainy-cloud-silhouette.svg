<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Rainy Cloud silhouette artwork</title>
  <desc id="desc">A little girl and a fox stand beside a small boat in a flooded landscape beneath a glowing rainy cloud.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#182a4a"/>
      <stop offset="0.58" stop-color="#547499"/>
      <stop offset="1" stop-color="#15282e"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f0eee8" stop-opacity=".96"/>
      <stop offset=".7" stop-color="#d5ff4f" stop-opacity=".32"/>
      <stop offset="1" stop-color="#d5ff4f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#29475c"/>
      <stop offset="1" stop-color="#0b171d"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8cfe2"/>
      <stop offset="1" stop-color="#718ca5"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="smallGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="rainClip">
      <rect width="1200" height="800"/>
    </clipPath>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>

  <circle cx="920" cy="178" r="124" fill="url(#moon)" filter="url(#softGlow)"/>
  <circle cx="920" cy="178" r="59" fill="#dce8dd" opacity=".86"/>
  <circle cx="942" cy="160" r="59" fill="#314d6a" opacity=".55"/>

  <g opacity=".32" fill="#d5ff4f">
    <circle cx="126" cy="138" r="3"/><circle cx="196" cy="92" r="2"/><circle cx="280" cy="184" r="3"/>
    <circle cx="1055" cy="85" r="2"/><circle cx="1104" cy="260" r="3"/><circle cx="764" cy="94" r="2"/>
  </g>

  <g transform="translate(168 104)">
    <ellipse cx="320" cy="170" rx="285" ry="78" fill="#7f9ab0" opacity=".25" filter="url(#softGlow)"/>
    <path d="M91 192C39 192 15 163 29 128c10-25 35-40 66-40 6-57 53-91 111-77 30-50 102-54 139-2 66-30 143 13 145 86 50-7 91 23 99 61 8 39-24 72-76 72H91Z" fill="url(#cloud)"/>
    <path d="M72 196c95-26 205-12 306-35 79-18 132-5 173 32" fill="none" stroke="#d5ff4f" stroke-opacity=".38" stroke-width="9" stroke-linecap="round"/>
    <path d="M105 225c91 17 216 16 335-12 56-13 101-12 142 1" fill="none" stroke="#192a40" stroke-opacity=".5" stroke-width="12" stroke-linecap="round"/>
  </g>

  <g clip-path="url(#rainClip)" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" values="0 -18; -10 18; 0 -18" dur="1.1s" repeatCount="indefinite"/>
    <g stroke="#d5ff4f" stroke-opacity=".62" stroke-width="5">
      <path d="M118 336l-42 121"/><path d="M182 312l-42 121"/><path d="M249 342l-42 121"/>
      <path d="M318 320l-42 121"/><path d="M387 340l-42 121"/><path d="M456 314l-42 121"/>
      <path d="M525 342l-42 121"/><path d="M594 316l-42 121"/><path d="M663 342l-42 121"/>
      <path d="M732 316l-42 121"/><path d="M801 344l-42 121"/><path d="M870 319l-42 121"/>
      <path d="M939 348l-42 121"/><path d="M1008 320l-42 121"/><path d="M1077 350l-42 121"/>
      <path d="M1146 326l-42 121"/>
    </g>
    <g stroke="#f0eee8" stroke-opacity=".34" stroke-width="3">
      <path d="M81 388l-27 76"/><path d="M215 370l-27 76"/><path d="M351 387l-27 76"/>
      <path d="M486 369l-27 76"/><path d="M622 392l-27 76"/><path d="M758 373l-27 76"/>
      <path d="M894 392l-27 76"/><path d="M1030 370l-27 76"/><path d="M1164 394l-27 76"/>
    </g>
  </g>

  <path d="M0 505c112-61 196-48 282-11 82 36 145 33 224-6 81-40 152-42 235 0 84 43 147 44 235 1 80-39 145-39 224 1v310H0Z" fill="#122429" opacity=".75"/>
  <path d="M0 567c118-46 210-39 289-9 91 34 160 29 246-9 83-37 152-35 235 7 84 42 151 42 240 3 73-32 130-33 190-8v249H0Z" fill="url(#water)"/>

  <g fill="none" stroke="#91baff" stroke-opacity=".45" stroke-width="3">
    <path d="M64 654c106-12 189-12 278 0"/><path d="M468 690c112-14 226-14 345 0"/>
    <path d="M894 622c77-10 144-10 237 2"/><path d="M170 742c85-9 167-9 249 0"/>
  </g>

  <g transform="translate(338 540)">
    <path d="M0 78 240 78l-33 70H33Z" fill="#080f13"/>
    <path d="M26 78 120 0l96 78Z" fill="#0b1418" stroke="#d5ff4f" stroke-opacity=".72" stroke-width="5"/>
    <path d="M120 1v77" stroke="#91baff" stroke-opacity=".65" stroke-width="4"/>
    <path d="M15 78h225" stroke="#f0eee8" stroke-opacity=".5" stroke-width="4"/>
  </g>

  <g transform="translate(284 434)" fill="#080d10">
    <circle cx="58" cy="50" r="25"/>
    <path d="M37 75h47l12 140H24Z"/>
    <path d="M34 209 5 310h31l44-93Z"/><path d="M77 209l35 101h30l-46-112Z"/>
    <path d="M31 91-31 166l20 17 72-66Z"/><path d="M88 92l77 54-16 23-78-41Z"/>
    <path d="M37 26 7 51l34 8Z"/>
  </g>

  <g transform="translate(554 598)" fill="#080d10">
    <path d="M0 47c26-47 107-52 146-10 22 25 36 27 75 13-12 38-48 53-91 42-48 14-105-2-130-45Z"/>
    <path d="M17 34-15-10 39 4l23 38Z"/>
    <path d="M158 39c45 9 62-10 82-38 8 33-10 64-49 73Z"/>
    <circle cx="47" cy="30" r="4" fill="#d5ff4f"/>
  </g>

  <g fill="#d5ff4f" opacity=".5">
    <circle cx="214" cy="638" r="4"/><circle cx="274" cy="674" r="3"/><circle cx="805" cy="666" r="4"/><circle cx="1015" cy="596" r="3"/>
  </g>
</svg>
